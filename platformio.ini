[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
monitor_speed = 115200
lib_deps = Wire, EEPROM, Servo(rp2040)
build_unflags = -std=gnu++17 -std=gnu++11
build_flags = -std=gnu++20 -Ilib -Wl,--defsym,setup=_ZN3app5setupEv -Wl,--defsym,loop=_ZN3app4loopEv

; PICOMON_BOARD is the index into rp2350.board.PROFILES.
[env:pico2]
board = rpipico2
build_flags = ${env.build_flags} -DPICOMON_BOARD=0

[env:pico2_w]
board = rpipico2w
build_flags = ${env.build_flags} -DPICOMON_BOARD=1

[env:beetle]
board = rpipico2
build_flags = ${env.build_flags} -DPICOMON_BOARD=2
board_upload.maximum_size = 2097152
